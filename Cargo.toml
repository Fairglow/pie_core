[workspace]
members = [
    ".",
    "tools/bench-table",
    "examples/dijkstra"]
resolver = "2"

[package]
name = "pie_core"
version = "0.2.14"
edition = "2024"
license = "MPL-2.0"
authors = ["Stefan Lindblad <stefan.lindblad@linux.com>"]
description = """
A high-performance, index-based data structure toolkit. Provides an arena
allocator (ElemPool) used to build a cache-friendly PieList
(doubly-linked list) and FibHeap (priority queue).
"""
readme = "README.md"
repository = "https://github.com/Fairglow/pie_core"
documentation = "https://docs.rs/pie_core"
keywords = [
    "arena",
    "list",
    "heap",
    "priority-queue",
    "data-structures"
]
categories = [
    "data-structures",
    "algorithms",
    "memory-management"
]

[dependencies]
# Used for the Dijkstra feature
hashbrown = { version = "0.16", optional = true }
petgraph = { version = "0.8", optional = true }
# Used for the serde feature
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = ["std"]
std = []
petgraph = ["dep:petgraph", "dep:hashbrown"]
serde = ["dep:serde"]
bench-nightly = []

[dev-dependencies]
criterion = "0.8"
fibonacci_heap = "0.9"
index_list = "0.3"
petgraph = "0.8"
priority-queue = "2.7"
proptest = "1"
rand = "0.10"
serde_json = "1.0"

[[bench]]
name = "benches"
harness = false

[profile.release]
codegen-units = 1
lto = true
